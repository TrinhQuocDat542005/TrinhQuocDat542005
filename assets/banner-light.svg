<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="banner-title banner-desc">
<title id="banner-title">Trịnh Quốc Đạt — Android, Backend and Applied AI</title>
<desc id="banner-desc">Name card with a diagram linking an Android client, a Spring Boot backend and an applied AI layer.</desc>
<style>
.flow { stroke-dasharray: 6 8; animation: flow 1.4s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -28; } }
@media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
</style>
<defs>
