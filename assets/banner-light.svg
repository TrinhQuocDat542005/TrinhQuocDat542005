<linearGradient id="fade" x1="0" x2="1" y1="0" y2="0"><stop offset="0.35" stop-color="#ffffff"/><stop offset="0.75" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
</defs>
<rect x="0.5" y="0.5" width="1199" height="299" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
<rect x="1" y="1" width="1198" height="298" rx="12" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="298" rx="12" fill="url(#fade)"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
