name: Update profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: '23 17 * * *'
  push:
    branches: [main]
    paths:
      - scripts/generate_activity.py
      - .github/workflows/profile-activity.yml

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render public contribution cards
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python scripts/generate_activity.py
      - name: Save updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-dark.svg assets/activity-light.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public contribution cards'
            git push
          fi
